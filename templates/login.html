<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="page-container">

        <div class="card form-card">

            <h1>Login</h1>

            <p class="subtitle">
                Acesse sua conta para gerenciar suas entregas
            </p>

            {% if erro %}
                <div class="mensagem-erro">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Sua senha"
                    required
                >

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Entrar
                </button>

            </form>

            <a
                href="/registro"
                class="btn-secondary"
            >
                Criar conta
            </a>

        </div>

    </div>

</body>

</html>
